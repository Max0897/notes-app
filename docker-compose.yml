services:
  notes-app:
    build:
      context: .
      # 构建时网络需要走代理的话，解开下面三行。
      # host.docker.internal 在 Docker Desktop 上指向宿主机。
      # args:
      #   HTTP_PROXY: http://host.docker.internal:7897
      #   HTTPS_PROXY: http://host.docker.internal:7897
    image: notes-app:latest
    container_name: notes-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /data
      # 容器对外是 HTTP，保持 false 浏览器才会保存会话 Cookie。
      # 前面挂了 HTTPS 反向代理（Nginx / Caddy / Traefik / Cloudflare Tunnel）就改成 "true"。
      SECURE_COOKIES: "false"
      # 留空 = 按 Host 头比对 Origin。反向代理改写 Host 时填公网地址，
      # 例如 https://note.example.com，否则写操作会全部 403。
      PUBLIC_ORIGIN: ""
      # 可选：仅列出受信任代理的实际 TCP 对端 IP，允许其传入 CF-Connecting-IP。
      # 不要填写公网客户端地址或任意来源；留空时不信任转发头。
      TRUSTED_PROXY_IPS: ""
    volumes:
      # 具名卷跨平台最省事，Docker 会按镜像里的属主初始化目录。
      - notes-data:/data
      # 想直接落在宿主机目录就换成下面这行。注意容器以非 root 的 node 用户
      # （uid 1000）运行，Linux 上要先 `sudo chown -R 1000:1000 ./data`。
      # - ./data:/data

volumes:
  notes-data:
